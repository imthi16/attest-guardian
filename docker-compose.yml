# The environment every service running application code needs. Defined once:
# three hand-maintained copies drift, and the one that drifts is always the
# service nobody exercises locally — the worker.
x-app-environment: &app-environment
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  APP_ENV: ${APP_ENV:-development}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-attest}:${POSTGRES_PASSWORD:-attest}@postgres:5432/${POSTGRES_DB:-attest}
  JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
  REDIS_URL: redis://redis:6379/0
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
  S3_BUCKET: ${S3_BUCKET:-attest-documents}
  S3_ENDPOINT: http://minio:9000
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}

name: attest-guardian

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attest}
      POSTGRES_USER: ${POSTGRES_USER:-attest}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      S3_BUCKET: ${S3_BUCKET:-attest-documents}
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    profiles: ["application"]
    build:
      context: ./apps/api
    environment: *app-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    profiles: ["application"]
    build:
      context: ./apps/web
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side only: the browser never sees this origin.
      API_INTERNAL_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Runs once, to completion, before anything serves. Migrations are a
  # deployment step rather than something a service does on boot: replicas
  # starting together would race the same DDL, and a failed migration inside a
  # startup path presents as a crash loop rather than as a failed deploy.
  migrate:
    profiles: ["application"]
    build:
      context: ./apps/api
    command: ["alembic", "-c", "/app/migrations/alembic.ini", "upgrade", "head"]
    environment: *app-environment
    volumes:
      - ./infra/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Without this service, uploads are accepted and never processed. Documents
  # sit at `pending` forever, the UI shows them queued, and nothing in the API's
  # health or readiness says a word — running the API without the worker is the
  # most plausible way to ship a broken product that looks entirely fine.
  worker:
    profiles: ["application"]
    build:
      context: ./apps/api
    command: ["python", "-m", "app.ingestion.worker"]
    environment:
      <<: *app-environment
      OCR_ENGINE: ${OCR_ENGINE:-none}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    # Deliberately no healthcheck. The worker serves no port, and a check that
    # only proved the process was alive would report a wedged worker as healthy
    # — which is the failure that actually happens. Its liveness is visible in
    # the ingestion metrics and the queue depth, not here.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true


volumes:
  minio_data:
  postgres_data:
  redis_data:
